name: jestr
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip

  # Core GPU stack (CUDA 12.1)
  - pytorch=2.1.2
  - pytorch-cuda=12.1
  - torchvision
  - torchaudio

  # GPU libraries
  - faiss-cpu=1.7.4 #faiss-gpu
  - cudnn

  # Scientific core
  - numpy=1.26.4
  - scipy=1.10.1
  - pandas=2.2.2
  - matplotlib=3.8.4
  - scikit-learn=1.3.0

  # Domain-specific scientific packages
  - rdkit
  - pyteomics
  - jinja2
  - sqlalchemy
  - reportlab
  - pytest

  # Useful system libs
  - ncurses
  - openssl